<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Book a visit</title>
  <link rel="stylesheet" href="static/style.css?v=d7f9aff8">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div class="pole" aria-hidden="true"><div class="pole-fill" id="poleFill"></div></div>

  <header class="top">
    <div class="shop">
      <div class="shop-name" id="shopName">Barber</div>
      <div class="shop-sub" id="shopSub"></div>
    </div>
    <button class="ghost" id="myBtn" type="button"></button>
  </header>

  <main id="view" aria-live="polite"></main>

  <footer class="bar" id="bar" hidden>
    <div class="bar-summary" id="barSummary"></div>
    <button class="primary" id="nextBtn" type="button"></button>
  </footer>

  <div class="toast" id="toast" role="status" hidden></div>

  <script src="static/app.js?v=cfa48023"></script>
</body>
</html>
